    <!-- Dữ liệu cấu trúc JSON-LD (Schema.org) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "__APP_URL__/#organization",
          "name": "Ong Nhỏ",
          "url": "__APP_URL__/",
          "logo": "__APP_URL__/bee-icon.svg",
          "description": "Giải pháp kiểm tra và tối ưu website dành cho doanh nghiệp nhỏ tại Việt Nam."

          "@id": "__APP_URL__/#webapp",
          "name": "Ong Nhỏ – Kiểm tra website",
          "url": "__APP_URL__/",
          "description": "Công cụ kiểm tra và chấm điểm website miễn phí của Ong Nhỏ giúp chủ doanh nghiệp dễ dàng rà soát lỗi SEO, tối ưu tốc độ, bảo mật và trải nghiệm người dùng.",

          "operatingSystem": "All",
          "inLanguage": "vi",
          "publisher": {

          }
        }
      ]
    }
